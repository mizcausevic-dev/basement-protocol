    <script>
      (function () {
        var themes = ['cyber', 'bento', 'swiss', 'aqua', 'brutal', 'steel', 'parchment']
        try {
          var t = localStorage.getItem('bp-theme')
          var m = localStorage.getItem('bp-mode')
          var el = document.documentElement
          if (t && themes.indexOf(t) > -1) el.dataset.theme = t
          if (m === 'light' || m === 'dark') {
            el.dataset.mode = m
            el.classList.toggle('dark', m === 'dark')
          }
        } catch (e) {}
      })()
    </script>
